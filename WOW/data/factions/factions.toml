# Embattled Frontier — focused faction catalogue.
#
# Two principal belligerents (Imperium, Orks) and one minor opportunist
# presence (Leagues of Votann). Weights are tuned so:
#   - Imperial force ≈ Ork force in total weighted presence (each ~75)
#   - Votann hold a single-digit foothold (~6)
#
# Overlay replaces presets/_base/data/factions/factions.toml during scaffold.

