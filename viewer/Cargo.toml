[package]
name = "sectorforge-viewer"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"

[dependencies]
sectorforge = { path = ".." }
sectorforge-gui-core = { path = "../gui-core" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
camino = { version = "1", features = ["serde1"] }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.29"
rfd = "0.17"

[features]
# §BEAUTY §5.5 — ship the bundled display/body/mono faces by default. Enables
# `gui-core/bundled-fonts`, which makes `fonts::install` (called from main.rs)
# embed the OFL faces in `gui-core/assets/fonts/` instead of running on egui's
# `default_fonts`. Build with `--no-default-features` to fall back to stock egui.
default = ["sectorforge-gui-core/bundled-fonts"]

[lints.clippy]
disallowed_types = "deny"
disallowed_methods = "deny"

[[bin]]
name = "sectorforge-viewer"
path = "src/main.rs"
