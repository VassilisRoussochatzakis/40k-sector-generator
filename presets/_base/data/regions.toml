# §5 NEW.md: regional warp phenomena overlay. Disabled by default so the
# bundled preset stays byte-identical to its pre-region baseline. Flip
# `enabled` to true to grow the overlay.

[regions]
enabled = false
count = 2
mean_size = 6
apply_to_routes = true

# Default condition pool (built-in weights also apply when this list is empty).
# [[regions.conditions]]
# kind = "warp_storm"
# weight = 2.0
# [[regions.conditions]]
# kind = "turbulence"
# weight = 3.0
