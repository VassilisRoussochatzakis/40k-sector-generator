# Embattled Frontier — dramatis personae pools (§3 NEW.md).
#
# War-themed kind pools for the three belligerents. Loader expects
# PersonaeConfig at file root (no [personae] wrapper).

min_world_dominance = "influence"
max_per_world = 3
max_per_system = 4

# ── Imperium ──────────────────────────────────────────────────────────────────

[kinds.imperial]
name_prefixes = ["Lord", "Lady", "Cardinal", "Marshal", "Magistrate", "Castellan", "Commissar"]
