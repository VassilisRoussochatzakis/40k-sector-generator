[project]
id = "llm-test-sector"
title = "Labyrinthine Frontier — LLM Test Sector"
description = "Extremely sparse, maximally varied sector exercising every generation feature: clustered placement, custom factions, warp regions, economy layer, history chronicle, analytics, HTML exports with player-redacted view, heatmaps, search wishes."
version = "1.0.0"

# ── Inputs ─────────────────────────────────────────────────────────────────────
[inputs]
world_data_dir = "data/worlds"
system_names = "data/names/system_names.toml"
world_names = "data/names/world_names.toml"
factions = "data/factions/factions.toml"
route_rules = "data/routes/route_rules.toml"
regions = "data/routes/regions.toml"
relations = "data/factions/relations.toml"
economy = "data/factions/economy.toml"
history = "data/factions/history.toml"

# ── Generation ─────────────────────────────────────────────────────────────────
[generation]
seed = "llm-test-labyrinthine-0x4E61"
sector_width = 48
sector_height = 32
subsector_width = 12
subsector_height = 8
system_count = 96
min_worlds_per_system = 1
max_worlds_per_system = 4
allow_empty_hexes = true
world_feature_count = 5

# Clustered placement — creates frontier "island" patterns with dead space.
[generation.placement]
mode = "clustered"
cluster_bias = 0.7
minimum_system_distance = 2

# World selection: weighted rows, allow partial rows for incomplete CSV data,
# bias same-star-colour but don't require it, allow duplicate types per system
# to exercise mixed-world systems.
[generation.world_selection]
mode = "weighted_rows"
require_complete_rows = false
allow_partial_rows = true
same_star_colour_bias = 1.5
strict_same_star_colour = false
avoid_duplicate_world_type_in_system = false

# Routes: medium density, long reach, connected graph guaranteed.
[generation.routes]
enabled = true
max_route_distance = 5
route_density = 0.08
ensure_connected_graph = true

# Relations: only keep factions present on 2+ worlds to shrink diplomacy matrix.
[generation.relations]
min_world_presence = 2

# ── Analytics ──────────────────────────────────────────────────────────────────
[analyze]
warn_faction_share = 0.35
warn_if_disconnected = true
warn_if_articulation = true
tiny_sector_threshold = 10
warn_contested_ratio = 0.25

# ── Outputs ────────────────────────────────────────────────────────────────────
[outputs]
directory = "out"
formats = ["json", "markdown", "csv", "bitmap", "html"]
pretty_json = true
write_per_system_files = true
write_manifest = true
write_diagnostics = true

# Bitmap: faction-filled hexes, Control heatmap, medium scale, imperial_archive theme.
[outputs.bitmap]
sector_scale = 2
system_scale = 2
render_systems = true
faction_fill = true
heatmap = "control"

# HTML: dark theme, full GM view.
[outputs.html]
theme = "dark"
# No player_observer → full GM edition.
player_min_confidence = 30
size_warn_bytes = 16777216
compact_json = false

# ── History ────────────────────────────────────────────────────────────────────
[history]
enabled = true
epoch_start = 3000
epoch_end = 3300
max_events_per_world = 4
max_events_per_system = 6
max_events_per_route = 2
key_events_top_n = 20

# Eras for chronicle labeling (relative epoch bands).
[[history.eras]]
id = "late_30s"
label = "Age of Strife II"
relative_start = 36
relative_end = 42
weight = 1.0
allowed_events = ["uprising", "necron_awakening", "blockade"]

[[history.eras]]
id = "early_31s"
label = "Apostasy Wars"
relative_start = 42
relative_end = 48
weight = 2.0
allowed_events = ["reconquest", "purge", "cult_exposed", "secession"]

[[history.eras]]
id = "mid_31s"
label = "Xeno Incursion Era"
relative_start = 48
relative_end = 54
weight = 2.0
allowed_events = ["tyranid_contact", "tau_contact", "aeldari_activity", "chaos_incursion"]

[[history.eras]]
id = "late_31s"
label = "Dark Age of Discovery (Current)"
relative_start = 54
relative_end = 60
weight = 3.0
allowed_events = ["discovery", "foundation", "annexation", "imperial_mandate_granted", "commercial_charter"]

# Event rules: guarantee certain event types for matching current-state facts.
[[history.event_rules]]
id = "hive_war"
when_system_state = "Warzone"
prefer_event = "Reconquest"
minimum_events = 1

[[history.event_rules]]
id = "daemon_incursion"
when_system_state = "DaemonicCorruption"
prefer_event = "ChaosIncursion"
minimum_events = 2

[[history.event_rules]]
id = "warp_storm"
when_system_state = "WarpPhenomena"
prefer_event = "WarpStormSurge"
minimum_events = 1

# ── Search defaults ────────────────────────────────────────────────────────────
[search]
# base_seed defaults to project seed.
budget = 512
