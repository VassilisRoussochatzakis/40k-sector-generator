# §5 NEW.md — Regional warp phenomena overlay.
#
# When `enabled = true`, the regions stage runs before route generation and
# the chosen conditions modify route stability inside their footprint.

[regions]
enabled = true
count = 10
mean_size = 16
apply_to_routes = true

# ── Custom condition pool ─────────────────────────────────────────────────────
# Sampled by weight when enabled. Built-in defaults (WarpStorm / Turbulence /
# CalmCorridor / Blackout / Anomaly) apply when this list is empty.
#
[[regions.conditions]]
kind = "warp_storm"
weight = 2.0
label = "Major warp storm"

[[regions.conditions]]
kind = "turbulence"
weight = 2.5
label = "Unstable empyric shoal"

[[regions.conditions]]
kind = "calm_corridor"
weight = 1.5
label = "Stable pilgrim corridor"

[[regions.conditions]]
kind = "blackout"
weight = 1.25
label = "Astropathic blackout zone"

[[regions.conditions]]
kind = "anomaly"
weight = 1.5
label = "Impossible signal field"

[[regions.conditions]]
kind = "necropolis_drift"
weight = 1.0
label = "Necropolis drift"

[[regions.conditions]]
kind = "beacon_chain"
weight = 1.0
label = "Ancient beacon chain"

[[regions.conditions]]
kind = "empyric_bleed"
weight = 1.5
label = "Empyric bleed"
