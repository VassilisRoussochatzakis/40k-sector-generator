[package]
name = "sector-generator"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["gui", "gui-core", "builder"]

[lib]
name = "sectorforge"
path = "src/lib.rs"

[[bin]]
name = "sectorforge"
path = "src/main.rs"

# OPTIMIZE.txt G4: heap-profiling driver. Only compiles with `--features dhat-heap`.
[[bin]]
name = "dhat-profile"
path = "src/bin/dhat_profile.rs"
required-features = ["dhat-heap"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
rand = "0.8"
rand_chacha = "0.3"
blake3 = "1"
camino = { version = "1", features = ["serde1"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rustc-hash = "2"
# FIX.txt §13: data-parallel candidate enumeration in src/search.rs. Order-
# preserving collect keeps `SearchOutcome.near_misses` byte-deterministic.
rayon = "1"
# OPTIMIZE.txt G4: optional heap profiler. Off by default — zero cost in
# normal builds. Enable with: `cargo build --features dhat-heap --bin dhat-profile`.
dhat = { version = "0.3", optional = true }

[features]
default = []
# OPTIMIZE.txt G4: gate dhat-heap behind a feature so production builds stay
# allocator-free.
dhat-heap = ["dep:dhat"]

[dev-dependencies]
tempfile = "3"
proptest = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "generation"
harness = false

[profile.dev]
# Library code keeps full debuginfo so the IDE / lldb can step through it.
# Dependencies get debug = false (see [profile.dev.package."*"]) so we don't pay
# the DWARF cost on every dep link.

[profile.dev.package."*"]
# Skip DWARF generation for dependencies. Cuts linker work on integration test
# bins and the GUI/builder binaries. Local code is unaffected.
debug = false

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
lto = "thin"
codegen-units = 1

# OPTIMIZE.txt G5: profiling profile inherits release but keeps frame pointers,
# line-table debug info, and symbols so flamegraph/samply/Instruments resolve.
# Use: `cargo build --profile profiling --bin sectorforge`
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
codegen-units = 16
lto = "thin"
