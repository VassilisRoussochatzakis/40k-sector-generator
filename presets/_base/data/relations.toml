# §4 NEW.md: inter-faction diplomacy overrides for the bundled preset.
# Built-in kind/disposition rules apply when this file is absent. This file
# adds an explicit "feed_conflict" advisory bias and a couple of pair-level
# overrides demonstrating the schema.

[relations]
feed_conflict = false

# Example: override a specific kind pair (Imperial vs. T'au) to Neutral.
# [[relations.kind_rules]]
# a = "imperial"
# b = "tau"
# stance = "neutral"
# cause = "Ceasefire under sector treaty"

# Example: pin a single faction-id pair.
# [[relations.pair_overrides]]
# a = "fac-imp-001"
# b = "fac-tau-001"
# stance = "rival"
# cause = "Border dispute"
