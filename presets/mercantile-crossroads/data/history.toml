# Mercantile Crossroads — sector chronicle (§1 NEW2.md).
#
# A prosperity arc: discovery, an early and enthusiastic compliance, waves of
# commercial charters, and a present day of crowded, well-policed lanes — with
# the occasional pirate blockade or tithe rebellion to keep it honest.
# Event-type vocabulary matches the proven set the generator emits.

[history]
enabled = true
epoch_start = 36
epoch_end = 42
max_events_per_world = 6
max_events_per_system = 5
max_events_per_route = 3
key_events_top_n = 36
max_subsector_events = 72

# ── Era bands ─────────────────────────────────────────────────────────────────

[[history.eras]]
id = "first_charters"
label = "The First Charters"
relative_start = -1300
relative_end = -900
weight = 1.0
allowed_events = ["discovery", "foundation", "commercial_charter"]

