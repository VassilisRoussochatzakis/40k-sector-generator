# §1 NEW2.md — Sector chronicle / historical timeline.
#
# Drives the derivation pass that walks every world's claim list, dominance,
# archetype state, and conflict to emit dated in-universe events. Output is
# embedded in sector.json and rendered to history.md.
#
# Event kinds (used by allowed_events / prefer_event):
#   foundation | discovery | annexation | imperial_mandate_granted |
#   consecration | commercial_charter | dynastic_claim | secession |
#   uprising | reconquest | purge | cult_exposed | necron_awakening |
#   tyranid_contact | ork_waaagh | quarantine_declared | blockade |
#   warp_storm_surge | tau_contact | aeldari_activity | chaos_incursion
#
# Aliases accepted: founding ⇒ foundation, compliance ⇒ imperial_mandate_granted,
#                   treaty ⇒ commercial_charter, rebellion ⇒ uprising,
#                   war ⇒ reconquest, awakening ⇒ necron_awakening.

[history]
enabled = true

# Imperial millennium prefix.
epoch_start = 36
epoch_end = 42

# Output caps.
max_events_per_world = 6
max_events_per_system = 4
max_events_per_route = 2
key_events_top_n = 25
max_subsector_events = 64

# ── Era bands ─────────────────────────────────────────────────────────────────
# relative_start / relative_end use M42-relative integers (negative = past).
# `allowed_events` empty ⇒ catch-all fallback for that span.

[[history.eras]]
id = "age_of_foundation"
label = "Age of Foundation"
relative_start = -1200
relative_end = -700
weight = 1.0
allowed_events = ["foundation", "discovery"]

[[history.eras]]
id = "great_crusade_echo"
label = "Echoes of the Great Crusade"
relative_start = -699
relative_end = -500
weight = 0.8
allowed_events = ["imperial_mandate_granted", "consecration", "dynastic_claim"]

[[history.eras]]
id = "age_of_compliance"
label = "Age of Compliance"
relative_start = -499
relative_end = -300
weight = 1.0
allowed_events = [
    "imperial_mandate_granted",
    "commercial_charter",
    "dynastic_claim",
    "consecration",
    "annexation",
]

[[history.eras]]
id = "age_of_fracture"
label = "Age of Fracture"
relative_start = -299
relative_end = -80
weight = 1.0
allowed_events = [
    "secession",
    "uprising",
    "cult_exposed",
    "aeldari_activity",
    "tau_contact",
]

[[history.eras]]
id = "age_of_wounds"
label = "Age of Wounds"
relative_start = -79
relative_end = -10
weight = 1.0
allowed_events = [
    "necron_awakening",
    "tyranid_contact",
    "ork_waaagh",
    "chaos_incursion",
    "warp_storm_surge",
    "quarantine_declared",
    "blockade",
]

[[history.eras]]
id = "indomitus_dawn"
label = "Indomitus Dawn"
relative_start = -9
relative_end = -1
weight = 1.1
allowed_events = ["reconquest", "purge", "consecration"]

[[history.eras]]
id = "present_crisis"
label = "Present Crisis"
relative_start = 0
relative_end = 0
weight = 1.5
allowed_events = ["reconquest", "purge", "chaos_incursion"]

# ── Event rules ───────────────────────────────────────────────────────────────
# Ensure at least N events of a given kind anchor wherever the matching
# system-state predicate holds.

[[history.event_rules]]
id = "warzone_war"
when_system_state = "warzone"
prefer_event = "reconquest"
minimum_events = 2

[[history.event_rules]]
id = "warzone_uprising"
when_system_state = "warzone"
prefer_event = "uprising"
minimum_events = 1

[[history.event_rules]]
id = "quarantined_purge"
when_system_state = "quarantined"
prefer_event = "quarantine_declared"
minimum_events = 1

[[history.event_rules]]
id = "quarantined_purge_2"
when_system_state = "quarantined"
prefer_event = "purge"
minimum_events = 1

[[history.event_rules]]
id = "blockaded_blockade"
when_system_state = "blockaded"
prefer_event = "blockade"
minimum_events = 1

[[history.event_rules]]
id = "contested_secession"
when_system_state = "contested"
prefer_event = "secession"
minimum_events = 1

[[history.event_rules]]
id = "stable_consecration"
when_system_state = "stable"
prefer_event = "consecration"
minimum_events = 1

[[history.event_rules]]
id = "lost_chaos"
when_system_state = "lost"
prefer_event = "chaos_incursion"
minimum_events = 1
