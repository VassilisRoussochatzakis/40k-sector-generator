# Embattled Frontier — diplomacy overlay (§5 NEW2.md).
#
# Pins the three principal kind-pair relationships explicitly so the
# generated diplomacy matrix reflects open war (Imperium vs. Orks),
# opportunistic distance (Imperium vs. Votann), and mutual contempt
# (Orks vs. Votann).

[relations]
feed_conflict = true

[[relations.kind_rules]]
a = "imperial"
b = "ork"
stance = "at_war"
cause = "Open frontier war; standing extermination order."

[[relations.kind_rules]]
a = "imperial_guard"
b = "ork"
stance = "at_war"
cause = "Standing Munitorum order: any Greenskin contact is to be engaged."

[[relations.kind_rules]]
a = "adeptus_astartes"
b = "ork"
stance = "at_war"
cause = "Chapter pursuit standing since the First Waaagh!."

[[relations.kind_rules]]
a = "deathwatch"
b = "ork"
stance = "at_war"
cause = "Kill-Team Xerxes is wholly tasked to Greenskin extermination."

[[relations.kind_rules]]
a = "mechanicus"
b = "ork"
stance = "hostile"
cause = "Looted-tech recovery operations pit them against ork meks."

[[relations.kind_rules]]
a = "imperial"
b = "leagues_of_votann"
stance = "rival"
cause = "Imperial authorities tolerate Votann commerce while disputing tithe sovereignty."

[[relations.kind_rules]]
a = "mechanicus"
b = "leagues_of_votann"
stance = "hostile"
cause = "Disputed claim over recovered archaeotech caches."

[[relations.kind_rules]]
a = "ork"
b = "leagues_of_votann"
stance = "hostile"
cause = "Orks raid kin convoys; the Kindreds answer with disproportionate force."
