# Dead Sector — planetary sites / points of interest (§7 NEW2.md).
#
# Tomb complexes, quarantine cordons, and ruin-vaults dominate. Manual entries
# anchor to default deterministic ids for the first few systems; the loader
# skips stale entries silently if the seed changes. Uninhabited worlds still
# get sites — most of the interest here is in dead places.

max_per_world = 4
skip_uninhabited = false
player_edition = false

