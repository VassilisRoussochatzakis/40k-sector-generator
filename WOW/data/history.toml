# ── Event rules ───────────────────────────────────────────────────────────────

[[history.event_rules]]
id = "warzone_reconquest"
when_system_state = "warzone"
prefer_event = "reconquest"
minimum_events = 2

[[history.event_rules]]
id = "warzone_waaagh"
when_system_state = "warzone"
prefer_event = "ork_waaagh"
minimum_events = 2

[[history.event_rules]]
id = "blockaded_blockade"
when_system_state = "blockaded"
prefer_event = "blockade"
minimum_events = 1

[[history.event_rules]]
id = "quarantined_quarantine"
when_system_state = "quarantined"
prefer_event = "quarantine_declared"
minimum_events = 1

[[history.event_rules]]
id = "contested_uprising"
when_system_state = "contested"
prefer_event = "uprising"
minimum_events = 1

[[history.event_rules]]
id = "stable_consecration"
when_system_state = "stable"
prefer_event = "consecration"
minimum_events = 1

[[history.event_rules]]
id = "lost_waaagh"
when_system_state = "lost"
prefer_event = "ork_waaagh"
minimum_events = 1
