[package]
name = "sectorforge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[workspace]
members = ["viewer", "gui-core", "builder"]

# Shared package metadata for the root crate + every workspace member. These
# three fields were identical across all four manifests; hoisting them here
# makes them a single source of truth (members reference each with
# `<field>.workspace = true`). Per-crate `name` stays inline.
[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.87"

# RUST_FIXES.md TF-S-3 / F-X06 dep-hygiene: single source of truth for every
# dependency shared by ≥2 workspace members. Per-crate manifests pull these in
# with `name.workspace = true` (adding crate-specific features inline where
# needed). Versions/features here are the canonical set; bump in one place.
[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
camino = { version = "1", features = ["serde1"] }
blake3 = "1"
rand = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
egui = "0.29"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = "0.17"
tempfile = "3"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
log = "0.4"
env_logger = "0.11"

# RUST_FIXES.md QW-C-4: hoist the disallowed-types/methods lint *level* to the
# workspace. The actual disallowed *paths* stay in the per-crate `clippy.toml`
# files (builder/ + viewer/), because that ban (`egui::Painter` etc.) is
# crate-scoped — `gui-core` legitimately owns the raw paint primitives, so a
# single root `clippy.toml` would wrongly fire on it. Each member opts in with
# `[lints] workspace = true`.
[workspace.lints.clippy]
disallowed_types = "deny"
disallowed_methods = "deny"

[lib]
path = "src/lib.rs"

[[bin]]
name = "sectorforge"
path = "src/main.rs"

# docs/OPTIMIZE.txt G4: heap-profiling driver. Only compiles with `--features dhat-heap`.
[[bin]]
name = "dhat-profile"
path = "src/bin/dhat_profile.rs"
required-features = ["dhat-heap"]

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
rand.workspace = true
rand_chacha = "0.3"
blake3.workspace = true
camino.workspace = true
image.workspace = true
rustc-hash = "2"
# Finding #29 (observability): CLI logging facade. The `log` macros sit in the
# CLI runners only (engine stays diagnostics-free, emitting via `on_progress`);
# `env_logger` is initialised once in `main()`. `RUST_LOG` controls verbosity.
log.workspace = true
env_logger.workspace = true
# FIX.txt §13: data-parallel candidate enumeration in src/search.rs. Order-
# preserving collect keeps `SearchOutcome.near_misses` byte-deterministic.
rayon = "1"
# docs/OPTIMIZE.txt G4: optional heap profiler. Off by default — zero cost in
# normal builds. Enable with: `cargo build --features dhat-heap --bin dhat-profile`.
dhat = { version = "0.3", optional = true }

[features]
default = []
# docs/OPTIMIZE.txt G4: gate dhat-heap behind a feature so production builds stay
# allocator-free.
dhat-heap = ["dep:dhat"]

[dev-dependencies]
tempfile.workspace = true
proptest = "1"
criterion = { workspace = true }
# #17: integration tests force `run_search` onto a single-thread rayon pool to
# prove its serialized output (incl. `near_misses`) matches the default parallel
# run byte-for-byte. Tracks the `rayon = "1"` pin in `[dependencies]`.
rayon = "1"

# RUST_FIXES.md QW-C-4: opt this crate into the workspace clippy lint levels.
[lints]
workspace = true

[[bench]]
name = "generation"
harness = false

# RUST_FIXES.md FU-9: per-hot-path criterion benches validating the §2.3 perf
# claims. One file per finding so each can be run in isolation.
[[bench]]
name = "briefing"
harness = false

[[bench]]
name = "seed_search"
harness = false

[[bench]]
name = "influence_field"
harness = false

[[bench]]
name = "render_png"
harness = false

[profile.dev]
# Library code keeps full debuginfo so the IDE / lldb can step through it.
# Dependencies get debug = false (see [profile.dev.package."*"]) so we don't pay
# the DWARF cost on every dep link.

[profile.dev.package."*"]
# Skip DWARF generation for dependencies. Cuts linker work on integration test
# bins and the GUI/builder binaries. Local code is unaffected.
debug = false

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Benchmarks run with release codegen so the numbers reflect shipping builds.
# Inherit release rather than re-pinning `lto = "fat"` / `codegen-units = 1`
# (the previous standalone keys, identical to release). `panic` / `strip` from
# release don't apply to the bench profile, so this is a pure no-divergence
# consolidation.
[profile.bench]
inherits = "release"

# docs/OPTIMIZE.txt G5: profiling profile inherits release but keeps frame pointers,
# line-table debug info, and symbols so flamegraph/samply/Instruments resolve.
# Use: `cargo build --profile profiling --bin sectorforge`
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
codegen-units = 16
lto = "thin"

# docs/OPTIMIZE.txt G6: fast local-launch profile for the `.cargo/config.toml`
# run aliases (sview / sbuild / sba / srun / sg). Inherits release's opt-level (3)
# so the GUI and the generation engine RUN at full speed, but drops the two
# shipping-only knobs that dominate compile time and force single-threaded,
# non-incremental work:
#   • `lto = false`        — fat LTO re-optimizes the whole binary as one unit on
#                            every edit (~34s on the builder bin alone).
#   • `codegen-units = 256`— release pins this to 1; 256 parallelizes codegen
#                            across cores and re-enables incremental caching.
# Net: a one-line GUI edit relinks in ~1s instead of ~85s. Ship real artifacts
# (fat-LTO, cgu=1) with plain `--release`; benchmark generation with `--release`
# too — `quick` loses cross-crate inlining and can be a few % slower at runtime.
[profile.quick]
inherits = "release"
lto = false
codegen-units = 256
incremental = true
