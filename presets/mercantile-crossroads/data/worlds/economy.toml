# Mercantile Crossroads — economy overlay (§12 NEW.md / §4 NEW2.md).
#
# A prosperous trade economy: surplus everywhere, strong trade multipliers, and
# resilient supply lines. Hive and forge worlds churn goods, agri-belts feed the
# crews, and every trade hub lifts the whole resource layer.

[economy]
enabled = true
feed_stability = true

[economy.by_world_type.HiveWorld]
foodstuffs = -50.0
manufactured = 80.0
recruits = 60.0

[economy.by_world_type.AgriWorld]
foodstuffs = 120.0
manufactured = -5.0
recruits = 30.0

[economy.by_world_type.ForgeWorld]
