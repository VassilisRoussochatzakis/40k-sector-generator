[package]
name = "sector-generator"
version = "0.1.0"
edition = "2021"

[lib]
name = "sectorforge"
path = "src/lib.rs"

[[bin]]
name = "sectorforge"
path = "src/main.rs"

[dependencies]
tyche = "0.3"
calamine = "0.30"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
rand = "0.8"
rand_chacha = "0.3"
blake3 = "1"
indexmap = { version = "2", features = ["serde"] }
camino = { version = "1", features = ["serde1"] }

[dev-dependencies]
tempfile = "3"

[[example]]
name = "example"
path = "examples/example.rs"
