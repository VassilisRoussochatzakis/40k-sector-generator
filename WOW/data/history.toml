# Embattled Frontier — sector chronicle (§1 NEW2.md).
#
# Eras lean toward conquest, loss, and ork-tide narratives. Event rules
# guarantee waaagh, warzone, blockade, and reconquest events anchor to the
# matching system states the generator emits.

[history]
enabled = true
epoch_start = 36
epoch_end = 42
max_events_per_world = 6
max_events_per_system = 4
max_events_per_route = 2
key_events_top_n = 30
max_subsector_events = 64

