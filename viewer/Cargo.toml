[package]
name = "sectorforge-viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
sectorforge = { path = ".." }
sectorforge-gui-core = { path = "../gui-core" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
clap.workspace = true
camino.workspace = true
eframe.workspace = true
egui.workspace = true
rfd.workspace = true

[features]
# §BEAUTY §5.5 — ship the bundled display/body/mono faces by default. Enables
# `gui-core/bundled-fonts`, which makes `fonts::install` (called from main.rs)
# embed the OFL faces in `gui-core/assets/fonts/` instead of running on egui's
# `default_fonts`. Build with `--no-default-features` to fall back to stock egui.
default = ["sectorforge-gui-core/bundled-fonts"]

# RUST_FIXES.md QW-C-4: disallowed-types/methods level comes from the workspace;
# the per-path ban list lives in this crate's `clippy.toml` (paint primitives
# belong in gui-core).
[lints]
workspace = true

[[bin]]
name = "sectorforge-viewer"
path = "src/main.rs"
