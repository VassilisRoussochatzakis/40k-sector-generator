[project]
id = "random-lmao"
title = "Random Sector lmao"
description = "Procedurally generated random sector."
version = "0.1.0"

[inputs]
world_data_dir = "data/worlds"
system_names = "data/names/system_names.toml"
world_names = "data/names/world_names.toml"
factions = "data/factions/factions.toml"
route_rules = "data/routes/route_rules.toml"
relations = "data/factions/relations.toml"
regions = "data/routes/regions.toml"
economy = "data/worlds/economy.toml"
history = "data/history.toml"
personae = "data/personae.toml"
sites = "data/sites.toml"
hooks = "data/hooks.toml"
missions = "data/missions.toml"
prose = "data/prose.toml"

[generation]
seed = "lmao"
sector_width = 80
sector_height = 80
subsector_width = 20
subsector_height = 20
system_count = 1959
min_worlds_per_system = 1
max_worlds_per_system = 6
allow_empty_hexes = true
world_feature_count = 3
strict_world_rows = true

[generation.placement]
mode = "uniform_grid"
cluster_bias = 0.0
minimum_system_distance = 1

[generation.world_selection]
mode = "weighted_rows"
require_complete_rows = true
allow_partial_rows = false
same_star_colour_bias = 1.1718843410908741
strict_same_star_colour = false
avoid_duplicate_world_type_in_system = true

[generation.routes]
enabled = true
max_route_distance = 4
route_density = 0.3100198391171203
ensure_connected_graph = true
# Target stability mix for public warp lanes. Quantile re-bucketing runs after
# the region overlay, so this Stable backbone survives the storm-heavy
# regions.toml instead of being flooded to Perilous. Weights are relative.
stability_targets = { stable = 0.32, unstable = 0.30, hazardous = 0.23, perilous = 0.15 }

[generation.relations]
min_world_presence = 2

[outputs]
directory = "out"
formats = [
    "json",
    "markdown",
    "bitmap",
    "svg",
    "html",
]
pretty_json = true
write_per_system_files = false
write_manifest = true
write_diagnostics = false

[outputs.bitmap]
sector_scale = 1
system_scale = 1
render_systems = true
faction_fill = true
heatmap = "off"

[outputs.bitmap.theme]

[outputs.html]
theme = "dark"
player_min_confidence = 30
size_warn_bytes = 8388608
compact_json = true

[map_theme]
name = "imperial_archive"

[analyze]
warn_faction_share = 0.5
warn_if_disconnected = true
warn_if_articulation = true
tiny_sector_threshold = 5
warn_contested_ratio = 0.6600000262260437

[search]
budget = 256
report_top = 5

[diff]
skip_worlds = false
skip_routes = false
min_faction_delta = 1.0
top_faction_deltas = 10

[history]
enabled = true
epoch_start = 36
epoch_end = 42
max_events_per_world = 6
max_events_per_system = 3
max_events_per_route = 1
key_events_top_n = 20
max_subsector_events = 64
event_rules = []

[[history.eras]]
id = "age_of_foundation"
label = "Age of Foundation"
relative_start = -900
relative_end = -650
weight = 1.0
allowed_events = [
    "foundation",
    "discovery",
]

