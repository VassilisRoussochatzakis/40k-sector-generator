# §5 NEW.md — Regional warp phenomena overlay.
#
# When enabled, the regions stage runs before route generation. Conditions
# inside region footprints modify route stability and tint the map.
#
# Condition kinds (all eight exercised below):
#   warp_storm | turbulence | calm_corridor | blackout | anomaly
#   | necropolis_drift | beacon_chain | empyric_bleed

[regions]
enabled = true
count = 5
mean_size = 7
apply_to_routes = true

# Weighted sampling pool. Custom labels override the built-in name.

[[regions.conditions]]
kind = "warp_storm"
weight = 2.5
label = "The Aurelian Maelstrom"

[[regions.conditions]]
kind = "turbulence"
weight = 3.0
label = "Drusus Currents"

[[regions.conditions]]
kind = "calm_corridor"
weight = 1.5
label = "Saint Lethe's Passage"

[[regions.conditions]]
kind = "blackout"
weight = 1.25
label = "The Pall of Vaxanide"

[[regions.conditions]]
kind = "anomaly"
weight = 1.5
label = "The Wyrmlight Anomaly"

[[regions.conditions]]
kind = "necropolis_drift"
weight = 1.0
label = "Zaragoz Necropolitan Drift"

[[regions.conditions]]
kind = "beacon_chain"
weight = 1.25
label = "The Iocanthos Beacon Chain"

[[regions.conditions]]
kind = "empyric_bleed"
weight = 1.0
label = "The Quaddis Bleed"
