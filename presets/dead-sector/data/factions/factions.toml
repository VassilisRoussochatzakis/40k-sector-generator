# Dead Sector — thin, dying faction roster.
#
# A near-abandoned void: stirring Necron dynasties, a clinging Imperial
# remnant, Mechanicus salvage-explorators picking the ruins, a quiet Ordo
# Xenos watch, and ork scavengers. Weights are low across the board — this is a
# sector of embers, not empires. Overlay replaces the inherited _base roster.

