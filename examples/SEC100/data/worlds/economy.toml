# §12 NEW.md & §4 NEW2.md — Trade & resource economy.
#
# Exercises every authorable knob:
#   • [economy] enabled / feed_stability
#   • [economy.by_world_type.<WorldType>]    — production/consumption vectors
#   • [economy.by_tech_level.<TechLevel>]    — multiplier on the vector
#   • [economy.by_population."population:*"] — population scale multiplier
#   • [resources.world_type.<WorldType>]     — strategic output rule (§4 NEW2)
#   • [resources.notable_feature.<Feature>]  — feature-scoped strategic rule

[economy]
enabled = true
feed_stability = true

