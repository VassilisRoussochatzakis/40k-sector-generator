[package]
name = "sectorforge-builder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
sectorforge = { path = ".." }
sectorforge-gui-core = { path = "../gui-core" }
eframe.workspace = true
egui.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
camino.workspace = true
clap.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
criterion = { workspace = true }

# RUST_FIXES.md QW-C-4: disallowed-types/methods level comes from the workspace;
# the per-path ban list lives in this crate's `clippy.toml` (paint primitives
# belong in gui-core).
[lints]
workspace = true

[[bin]]
name = "sectorforge-builder"
path = "src/main.rs"

# T7/§40, PERF1/§42 — large-sector mutation benchmark. `harness = false` because
# the bench supplies its own `criterion_main!` entry point.
[[bench]]
name = "builder_mutations"
harness = false
