[package]
name = "sectorforge"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"

[workspace]
members = ["viewer", "gui-core", "builder"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "sectorforge"
path = "src/main.rs"

# docs/OPTIMIZE.txt G4: heap-profiling driver. Only compiles with `--features dhat-heap`.
[[bin]]
name = "dhat-profile"
path = "src/bin/dhat_profile.rs"
required-features = ["dhat-heap"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
rand = "0.8"
rand_chacha = "0.3"
blake3 = "1"
camino = { version = "1", features = ["serde1"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rustc-hash = "2"
# FIX.txt §13: data-parallel candidate enumeration in src/search.rs. Order-
# preserving collect keeps `SearchOutcome.near_misses` byte-deterministic.
rayon = "1"
# docs/OPTIMIZE.txt G4: optional heap profiler. Off by default — zero cost in
# normal builds. Enable with: `cargo build --features dhat-heap --bin dhat-profile`.
dhat = { version = "0.3", optional = true }

[features]
default = []
# docs/OPTIMIZE.txt G4: gate dhat-heap behind a feature so production builds stay
# allocator-free.
dhat-heap = ["dep:dhat"]

[dev-dependencies]
tempfile = "3"
proptest = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "generation"
harness = false

[profile.dev]
# Library code keeps full debuginfo so the IDE / lldb can step through it.
# Dependencies get debug = false (see [profile.dev.package."*"]) so we don't pay
# the DWARF cost on every dep link.

[profile.dev.package."*"]
# Skip DWARF generation for dependencies. Cuts linker work on integration test
# bins and the GUI/builder binaries. Local code is unaffected.
debug = false

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
lto = "fat"
codegen-units = 1

# docs/OPTIMIZE.txt G5: profiling profile inherits release but keeps frame pointers,
# line-table debug info, and symbols so flamegraph/samply/Instruments resolve.
# Use: `cargo build --profile profiling --bin sectorforge`
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
codegen-units = 16
lto = "thin"

# docs/OPTIMIZE.txt G6: fast local-launch profile for the `.cargo/config.toml`
# run aliases (sview / sbuild / sba / srun / sg). Inherits release's opt-level (3)
# so the GUI and the generation engine RUN at full speed, but drops the two
# shipping-only knobs that dominate compile time and force single-threaded,
# non-incremental work:
#   • `lto = false`        — fat LTO re-optimizes the whole binary as one unit on
#                            every edit (~34s on the builder bin alone).
#   • `codegen-units = 256`— release pins this to 1; 256 parallelizes codegen
#                            across cores and re-enables incremental caching.
# Net: a one-line GUI edit relinks in ~1s instead of ~85s. Ship real artifacts
# (fat-LTO, cgu=1) with plain `--release`; benchmark generation with `--release`
# too — `quick` loses cross-crate inlining and can be a few % slower at runtime.
[profile.quick]
inherits = "release"
lto = false
codegen-units = 256
incremental = true
