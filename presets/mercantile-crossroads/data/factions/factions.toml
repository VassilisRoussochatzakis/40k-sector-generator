# Mercantile Crossroads — dense trade-faction roster.
#
# Rogue Trader dynasties, the Chartist Captains' Union, kin merchant guilds,
# and forge-trade Magi crowd the lanes; the Administratum taxes them all and
# ork freebooters prey on the convoys. Weights favour many mid-sized players
# over one hegemon. Overlay replaces the inherited _base roster.

