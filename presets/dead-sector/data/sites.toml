id = "site-sautekh-tomb"
world_id = "sys-0001-w01"
system_id = "sys-0001"
kind = "xenos_ruin"
name = "The Sautekh Tomb-Spire"
controlling_faction = "sautekh_dynasty"
known_to = ["ordo_xenos_watch", "explorator_salvage"]
public_status = "quarantined"
actual_status = "active"
tags = ["necron-tomb", "waking", "gauss-scarred"]
hook = "The spire's lights came on three nights ago, and have not gone out."

