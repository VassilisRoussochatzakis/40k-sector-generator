# presets/m42-classic — the balanced, fully-featured default sector.
#
# Inherits the shared _base data tree (worlds workbook, names, the canonical
# faction roster, route rules) and overlays a complete set of themed overlays:
# relations, regions, economy, history, personae, sites, hooks, missions, and
# prose — every input the engine understands. Every output format is emitted
# (json, markdown, bitmap, svg, html). This is the general-purpose baseline for
# `sectorforge random --baseline m42-classic`.

[project]
id = "m42-classic"
title = "M42 Classic"
description = "Balanced canonical Imperium sector — the default M42 setup, every overlay and output enabled."
version = "0.2.0"

# ── Inputs (every authorable overlay) ─────────────────────────────────────────

[inputs]
world_data_dir = "data/worlds"
system_names = "data/names/system_names.toml"
world_names = "data/names/world_names.toml"
factions = "data/factions/factions.toml"
route_rules = "data/routes/route_rules.toml"
relations = "data/factions/relations.toml"
regions = "data/routes/regions.toml"
economy = "data/worlds/economy.toml"
history = "data/history.toml"
personae = "data/personae.toml"
sites = "data/sites.toml"
hooks = "data/hooks.toml"
missions = "data/missions.toml"
prose = "data/prose.toml"

# ── Generation (balanced 10x10) ───────────────────────────────────────────────

[generation]
seed = "m42-default-seed"
sector_width = 10
sector_height = 10
system_count = 24
min_worlds_per_system = 2
max_worlds_per_system = 6
allow_empty_hexes = true
world_feature_count = 3

[generation.placement]
cluster_bias = 0.0
minimum_system_distance = 1

[generation.world_selection]
same_star_colour_bias = 1.25
strict_same_star_colour = false
avoid_duplicate_world_type_in_system = false

[generation.routes]
enabled = true
max_route_distance = 4
route_density = 0.30
ensure_connected_graph = true

[generation.relations]
min_world_presence = 1

# ── Analyze (§8 NEW.md) ───────────────────────────────────────────────────────

[analyze]
warn_faction_share = 0.60
warn_if_disconnected = true
warn_if_articulation = true
tiny_sector_threshold = 5
warn_contested_ratio = 0.45

# ── Seed-search defaults (§2 NEW.md) ──────────────────────────────────────────

[search]
budget = 256
report_top = 5

# ── Sector diff defaults (§10 NEW.md) ────────────────────────────────────────

[diff]
skip_worlds = false
skip_routes = false
min_faction_delta = 1.0
top_faction_deltas = 10

# ── History (§1 NEW2.md) — full eras live in data/history.toml ────────────────

[history]
enabled = true
epoch_start = 34
epoch_end = 42
max_events_per_world = 5
max_events_per_system = 4
max_events_per_route = 2
key_events_top_n = 30
max_subsector_events = 64

# ── Outputs (every format) ────────────────────────────────────────────────────

[outputs]
directory = "out"
formats = ["json", "markdown", "bitmap", "svg", "html"]
pretty_json = true
write_per_system_files = true
write_manifest = true
write_diagnostics = true

[outputs.bitmap]
sector_scale = 5
system_scale = 4
render_systems = true
faction_fill = true

[outputs.html]
theme = "dark"
player_min_confidence = 30
size_warn_bytes = 8388608
compact_json = true

# ── Map theme (§13 NEW2.md) ───────────────────────────────────────────────────

[map_theme]
name = "gm_dark"
show_subsector_borders = true
route_line_mode = "hazard_weighted"
label_density = "important_only"
legend = "full"
symbol_set = "tactical"
