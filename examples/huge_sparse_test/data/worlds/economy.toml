# §12 NEW.md — Trade & resource economy production/consumption tables.
#
# All fields optional. Missing keys fall through to the built-in defaults
# shipped in `src/economy.rs` (HiveWorld → food deficit, ForgeWorld →
# manufactured surplus, AgriWorld → food surplus, etc.).

[economy]
enabled = true
feed_stability = true

# ── Per-world-type overrides ──────────────────────────────────────────────────
# Values are signed: positive = surplus, negative = deficit.
#
# [economy.by_world_type.HiveWorld]
# ore = 0.0
# promethium = 0.0
# foodstuffs = -60.0
# manufactured = 50.0
# archeotech = 0.0
# recruits = 80.0

# ── Tech-level multipliers ────────────────────────────────────────────────────
# Multiplies the per-world-type vector before population scaling.
#
# [economy.by_tech_level]
# Imperial = 1.0
# Mechanicus = 1.2
# Archeotech = 1.6

# ── Population multipliers (tag form: "population:massive" etc.) ──────────────
# [economy.by_population]
# "population:massive" = 1.5
# "population:standard" = 1.0
# "population:minimal" = 0.25

# ── §4 NEW2.md strategic output / tithe rules ────────────────────────────────
# Scores are normalized 0..=100. World-type rules override built-ins per
# field; notable-feature rules add to built-ins and may multiply trade volume
# or alter supply resilience.
#
# [resources.world_type.AgriWorld]
# food = 90
# manpower = 20
# manufacturing = 5
#
# [resources.notable_feature.TradeHub]
# trade_multiplier = 1.4
# supply_resilience = 10
