# Embattled Frontier — economy overlay (§12 NEW.md / §4 NEW2.md).
#
# Active derivation tuned for a wartime economy: agri-belts feed armies,
# forge worlds and hive worlds churn munitions, and the resource layer
# emphasises manpower and supply resilience.

[economy]
enabled = true
feed_stability = true

[economy.by_world_type.HiveWorld]
foodstuffs = -60.0
manufactured = 70.0
recruits = 90.0
munitions = 50.0

[economy.by_world_type.AgriWorld]
foodstuffs = 120.0
manufactured = -10.0
recruits = 40.0

[economy.by_world_type.ForgeWorld]
manufactured = 90.0
munitions = 80.0
archaeotech = 10.0

[economy.by_world_type.IndustrialWorld]
manufactured = 60.0
munitions = 30.0

[economy.by_world_type.BastionWorld]
manufactured = 30.0
munitions = 60.0
recruits = 50.0

[economy.by_world_type.FrontierWorld]
foodstuffs = 10.0
manufactured = -10.0
recruits = -10.0

[economy.by_world_type.DeathWorld]
recruits = 20.0
foodstuffs = -20.0

[economy.by_tech_level]
Imperial = 1.0
Mechanicus = 1.3
Primitive = 0.6

[economy.by_population]
"population:massive" = 1.6
"population:standard" = 1.0
"population:sparse" = 0.5

