[project]
id = "embattled-frontier"
title = "Embattled Frontier"
description = "20x20 contested marchworld sector: Imperium vs. Orks with a small Leagues of Votann presence. Sparse, high-hazard, fully fleshed-out."
version = "0.2.0"

# ── Inputs ────────────────────────────────────────────────────────────────────
# Every authorable overlay enabled. Files under data/ overlay the inherited
# _base tree; missing files fall through to bundled defaults.

[inputs]
world_data_dir = "data/worlds"
system_names = "data/names/system_names.toml"
world_names = "data/names/world_names.toml"
factions = "data/factions/factions.toml"
route_rules = "data/routes/route_rules.toml"
relations = "data/factions/relations.toml"
regions = "data/routes/regions.toml"
economy = "data/worlds/economy.toml"
history = "data/history.toml"
personae = "data/personae.toml"
sites = "data/sites.toml"

# ── Generation ────────────────────────────────────────────────────────────────

[generation]
seed = "embattled-frontier-seed"
sector_width = 20
sector_height = 20
subsector_width = 5
subsector_height = 5
# Sparse occupancy on a 400-hex grid — ~14% populated. Leaves vast empty marches
# for warp storms and ork advances to claim.
system_count = 56
min_worlds_per_system = 1
max_worlds_per_system = 4
allow_empty_hexes = true
world_feature_count = 4
strict_world_rows = true

[generation.placement]
mode = "clustered"
cluster_bias = 0.55
minimum_system_distance = 1

[generation.world_selection]
mode = "weighted_rows"
require_complete_rows = true
allow_partial_rows = false
same_star_colour_bias = 1.10
strict_same_star_colour = false
avoid_duplicate_world_type_in_system = false

[generation.routes]
enabled = true
# Long-hop frontier — fewer safe lanes, larger jumps.
max_route_distance = 6
route_density = 0.20
ensure_connected_graph = true

[generation.relations]
min_world_presence = 1

# ── Analyze (§8 NEW.md) ───────────────────────────────────────────────────────

[analyze]
warn_faction_share = 0.55
warn_if_disconnected = true
warn_if_articulation = true
tiny_sector_threshold = 5
warn_contested_ratio = 0.50

# ── Seed-search defaults (§2 NEW.md) ──────────────────────────────────────────

[search]
budget = 256
report_top = 5

# ── Sector diff defaults (§10 NEW.md) ────────────────────────────────────────

[diff]
skip_worlds = false
skip_routes = false
min_faction_delta = 1.0
top_faction_deltas = 10

# ── History (§1 NEW2.md) ──────────────────────────────────────────────────────
# Top-level fallback values; the full eras + event_rules live in data/history.toml.

[history]
enabled = true
epoch_start = 36
epoch_end = 42
max_events_per_world = 6
max_events_per_system = 4
max_events_per_route = 2
key_events_top_n = 30
max_subsector_events = 64

# ── Outputs ───────────────────────────────────────────────────────────────────

[outputs]
directory = "out"
formats = ["json", "markdown", "bitmap", "html"]
pretty_json = true
write_per_system_files = true
write_manifest = true
write_diagnostics = true

[outputs.bitmap]
sector_scale = 5
system_scale = 4
render_systems = true
faction_fill = true
heatmap = "threat"

[outputs.html]
theme = "dark"
player_min_confidence = 30
size_warn_bytes = 8388608
compact_json = true

# ── Map theme (§13 NEW2.md) ───────────────────────────────────────────────────

[map_theme]
name = "navis_tactical"
show_subsector_borders = true
route_line_mode = "hazard_weighted"
label_density = "important_only"
legend = "full"
symbol_set = "tactical"
faction_tint_strength = 0.50
heatmap_tint_min = 0.10
heatmap_tint_range = 0.90
route_thickness = 2.2
region_tint_strength = 0.35
