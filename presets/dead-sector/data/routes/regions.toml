# Dead Sector — warp phenomena overlay (§5 NEW.md).
#
# A haunted, silent void: warp blackouts swallow astropathic signals, anomalies
# riddle the dark, and storms wander the empty marches. Calm corridors are
# vanishingly rare. `count` / `mean_size` are scaled to the grid by
# `sectorforge random`.

[regions]
enabled = true
count = 5
mean_size = 8
apply_to_routes = true

[[regions.conditions]]
kind = "blackout"
weight = 3.0

[[regions.conditions]]
kind = "anomaly"
weight = 2.5

[[regions.conditions]]
kind = "warp_storm"
weight = 2.0

[[regions.conditions]]
kind = "turbulence"
weight = 1.5

[[regions.conditions]]
kind = "calm_corridor"
weight = 0.4
