# §7 NEW2.md — Planetary sites / points of interest.
#
# Drives the per-world site overlay. Each inhabited world derives up to
# `max_per_world` named locations (cathedral, manufactorum, tomb complex…).
# Manual entries below are appended verbatim and survive `player_edition`
# only when their `public_status == actual_status`.
#
# Loader expects `SitesConfig` at the file root (no `[sites]` wrapper).
#
# SiteKind enum:
#   governors_palace | cathedral_spire | manufactorum | underhive_sump_city |
#   void_elevator | star_fort_dockyard | quarantine_zone | xenos_ruin |
#   pilgrim_necropolis | astropathic_choir | arbites_precinct | data_vault |
#   disputed_shrine | penal_mine | black_market_enclave | cult_safehouse |
#   crashed_voidship | agri_belt_granary | forge_reactor | tomb_complex |
#   naval_anchorage
#
# SiteStatus enum:
#   active | restricted | abandoned | quarantined | sealed | contested |
#   under_construction

max_per_world = 5
skip_uninhabited = false
player_edition = false

# ── Manual sites ──────────────────────────────────────────────────────────────
# `known_to` lists faction ids that can see the site at all; an empty list
# means the site is universally known. `public_status` differing from
# `actual_status` is hidden in `player_edition`.

