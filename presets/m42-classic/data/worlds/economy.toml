# M42 Classic — economy overlay (§12 NEW.md / §4 NEW2.md).
#
# A balanced Imperial economy: agri-belts feed the hives, forge and industrial
# worlds manufacture, and trade hubs lift the whole supply layer. Tuned for a
# stable, self-sufficient sector rather than a wartime or depressed one.

[economy]
enabled = true
feed_stability = true

[economy.by_world_type.HiveWorld]
foodstuffs = -50.0
manufactured = 60.0
recruits = 70.0
munitions = 20.0

[economy.by_world_type.AgriWorld]
foodstuffs = 110.0
manufactured = -10.0
recruits = 30.0

[economy.by_world_type.ForgeWorld]
manufactured = 90.0
munitions = 50.0
archaeotech = 15.0

[economy.by_world_type.IndustrialWorld]
manufactured = 70.0
munitions = 20.0

[economy.by_world_type.BastionWorld]
manufactured = 30.0
munitions = 40.0
recruits = 40.0

[economy.by_world_type.FrontierWorld]
foodstuffs = 15.0
manufactured = -5.0

[economy.by_tech_level]
Imperial = 1.0
Mechanicus = 1.3
Primitive = 0.6

[economy.by_population]
"population:massive" = 1.6
"population:standard" = 1.0
"population:sparse" = 0.5

