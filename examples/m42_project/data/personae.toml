# §3 NEW.md — Dramatis personae pools.
#
# Drives the named-character overlay. Each significant faction presence
# (≥ min_world_dominance) and each system slot (sovereign / orbital_controller
# / economic_hegemon / hidden_master) anchors a persona built from the matching
# faction-kind pool. Missing pools fall through to the built-in catalogue.
#
# Loader expects `PersonaeConfig` at the file root (no `[personae]` wrapper).

min_world_dominance = "influence"
max_per_world = 3
max_per_system = 4

# ── Per-faction-kind pools ────────────────────────────────────────────────────
# Keys are the `kind` string used in factions.toml. Built-in pools are merged
# with the entries below.

[kinds.imperial]
name_prefixes = ["Lord", "Lady", "Cardinal", "Marshal", "Magistrate", "Castellan"]
name_roots = [
    "Argentius", "Belisar", "Cassia", "Drusilla", "Eustace", "Faustinus",
    "Galenius", "Hadria", "Iocanthe", "Julien", "Klemens", "Lucia",
    "Marcellus", "Nyssa", "Octavian", "Pallas", "Quintus", "Roderick",
    "Sabina", "Tarsus", "Ulrick", "Valerian", "Xerxes", "Yseult", "Zephyr",
]
name_suffixes = ["the Iron", "Vox", "the Stern", "the Untiring", "Aquilon", "the Just"]
single_names = ["Drusus Erasmus", "Saint Caelia", "Lord-General Vorne"]
titles = [
    "Sector Lord", "Lord-Governor", "Cardinal-Astral", "Lord Marshal",
    "Prefect of Munitorum", "Magistrate-Penitent",
]
traits = [
    "iron-jawed", "tireless", "incorruptible", "ruthless", "calculating",
    "devout", "burdened by duty", "vain", "ascetic",
]

[kinds.mechanicus]
