# §5 NEW2.md — Inter-faction diplomacy / attitude matrix rules.
#
# All fields optional. Missing kind pairs fall through to the built-in
# defaults (Imperial↔Chaos = AtWar, etc.) shipped in `src/relations.rs`.
# Legacy per-pair overrides (by faction id) bypass the kind/disposition
# pipeline. Rich overrides can additionally pin public/secret attitudes,
# treaty status, and relation dimensions.

[relations]
# Whether the derived matrix biases the conflict tick (advisory). The
# matrix itself is always derived when this file is referenced.
feed_conflict = false

# ── Custom kind rules ─────────────────────────────────────────────────────────
# Each rule is symmetric (`a ↔ b`). The first user rule that matches a pair
# wins; otherwise the built-in defaults apply.
#
# Example: override the default Imperial↔Mechanicus "Aligned" to "Allied".
[[relations.kind_rules]]
a = "imperial"
b = "mechanicus"
stance = "allied"
cause = "Treaty of Mars — sworn co-rulership"

# ── Disposition deltas ────────────────────────────────────────────────────────
# Stance level delta applied on top of the kind base. Positive = more hostile.
[[relations.disposition_rules]]
a = "zealous"
b = "hostile"
delta = 1
cause = "Mutual escalation of zeal and hostility"

# ── Pair overrides ────────────────────────────────────────────────────────────
# Pinned per-pair stances by faction id. These bypass kind/disposition.
# [[relations.pair_overrides]]
# a = "imperial_administration"
# b = "free_traders"
# stance = "aligned"
# cause = "Charter granted under Lex Imperialis"

# Rich NEW2 override. `public_attitude` / `secret_attitude` apply
# symmetrically; `a_public_attitude`, `b_secret_attitude`, etc. can make the
# relation asymmetric.
# [[relations.overrides]]
# a = "fac-house-vorn"
# b = "fac-rogue-trader-cassian"
# public_attitude = "friendly"
# secret_attitude = "hostile"
# treaty_status = "charter"
# trust = 35
# rivalry = 70
# reason = "Succession debt and a disputed charter"
