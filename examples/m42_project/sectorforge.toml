[project]
id = "m42-sector"
title = "M42 Generated Sector"
description = "A generated sector built from the M42 world workbook."
version = "0.1.0"

[inputs]
world_data_dir = "data/worlds"
system_names = "data/names/system_names.toml"
world_names = "data/names/world_names.toml"
factions = "data/factions/factions.toml"
route_rules = "data/routes/route_rules.toml"
# §5 NEW2.md — kind/disposition stance rules + public/secret relation overrides.
relations = "data/factions/relations.toml"
# §5 NEW.md — regional warp phenomena overlay catalogue + stage params.
regions = "data/routes/regions.toml"
# §12 NEW.md — trade & resource economy production / consumption tables.
economy = "data/worlds/economy.toml"

[generation]
seed = "m42-default-seed"
sector_width = 8
sector_height = 10
subsector_width = 4
subsector_height = 5
system_count = 24
min_worlds_per_system = 2
max_worlds_per_system = 6
allow_empty_hexes = true
world_feature_count = 3
strict_world_rows = true

[generation.placement]
mode = "uniform_grid"
cluster_bias = 0.0
minimum_system_distance = 1

[generation.world_selection]
mode = "weighted_rows"
require_complete_rows = true
allow_partial_rows = false
same_star_colour_bias = 1.25
strict_same_star_colour = false
avoid_duplicate_world_type_in_system = false

[generation.routes]
enabled = true
max_route_distance = 4
route_density = 0.30
ensure_connected_graph = true

[outputs]
directory = "out"
formats = ["json", "markdown", "csv", "bitmap"]
pretty_json = true
write_per_system_files = true
write_manifest = true

[outputs.bitmap]
# Integer scale multipliers over the base design size. Range: 1..=8.
# sector_scale = 5 lands around 3600x2300 (≈ 4K width).
# system_scale = 4 lands around 4320x2880.
sector_scale = 5
system_scale = 4
render_systems = true
