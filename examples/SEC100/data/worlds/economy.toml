# ── Tech-level multipliers ────────────────────────────────────────────────────
# Multiplies the per-world-type vector before population scaling.

[economy.by_tech_level]
Primitive = 0.35
Low = 0.70
Standard = 1.00
High = 1.30
XenoHybrid = 1.15
Archaeotech = 1.60

# ── Population multipliers ────────────────────────────────────────────────────
# Keys use the "population:<tag>" tag form expected by the loader.

[economy.by_population]
"population:uninhabited" = 0.10
"population:minimal" = 0.35
"population:lightly_populated" = 0.65
"population:sole_settlement" = 0.85
"population:densely_populated" = 1.25
"population:extremely_dense" = 1.75

